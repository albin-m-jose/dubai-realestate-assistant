services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n-realestate
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Dubai
      - TZ=Asia/Dubai
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=https://${NGROK_DOMAIN}/
      - N8N_RESTRICT_FILE_ACCESS_TO=/data/knowledge
    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge:/data/knowledge:ro
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-realestate
    command: http n8n:5678
    ports:
      - "127.0.0.1:4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  n8n_data: